# Keep the dependency surface current.
#
# This server's own code is a poor target — 250 lines, no user input beyond a
# constant-time token comparison, outbound GETs only, no write path. The
# realistic vulnerability lands in fastmcp/httpx/uvicorn/starlette or the Python
# base image instead, and those are exactly the ones that can be patched without
# anyone thinking about it.
#
# Weekly, not daily: this is a small project and a PR nobody reads is worse than
# no PR at all.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
